openapi: 3.0.3
info:
  title: Example Petstore
  version: 1.0.0
  description: Tiny example spec used by the choda-gateway ADR-006 walkthrough.
servers:
  - url: https://petstore.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets (optionally filtered by status)
      tags: [pet]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: Add a new pet to the store
      tags: [pet]
      x-choda-timeout-ms: 10000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPet
      summary: Fetch a pet by id
      tags: [pet]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string }
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string }
        status: { type: string }
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
